name: Build ZalReff V2.1.0

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Extract Source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ -f pom.xml ]; then
            PROJECT_DIR="."
          else
            mapfile -t ZIP_FILES < <(
              find . -maxdepth 1 -type f -iname '*.zip'
            )

            if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
              echo "Harus ada tepat satu ZIP source di root repository."
              exit 1
            fi

            mkdir -p _source
            unzip -oq "${ZIP_FILES[0]}" -d _source

            POM_PATH="$(find _source -type f -name pom.xml -print -quit)"

            if [ -z "$POM_PATH" ]; then
              echo "pom.xml tidak ditemukan!"
              exit 1
            fi

            PROJECT_DIR="$(dirname "$POM_PATH")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build with Maven
        run: |
          mvn --batch-mode --no-transfer-progress \
          -f "$PROJECT_DIR/pom.xml" clean package

      - name: Verify JAR
        run: |
          test -f "$PROJECT_DIR/target/ZalReff-V2.jar"
          jar tf "$PROJECT_DIR/target/ZalReff-V2.jar" | grep -qx 'plugin.yml'

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZalReff-V2.1.0
          path: ${{ env.PROJECT_DIR }}/target/ZalReff-V2.jar
          if-no-files-found: error
          retention-days: 14
          
