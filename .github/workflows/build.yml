name: Build ZalReff V2.1.0

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "pom.xml" ]; then
            PROJECT_DIR="."
          else
            ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Source ZIP tidak ditemukan!"
              exit 1
            fi

            mkdir -p _source
            unzip -oq "$ZIP_FILE" -d _source

            POM_FILE=$(find _source -type f -name pom.xml -print -quit)

            if [ -z "$POM_FILE" ]; then
              echo "ERROR: pom.xml tidak ditemukan dalam ZIP!"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$POM_FILE")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project ditemukan di: $PROJECT_DIR"

      - name: Build with Maven
        run: |
          mvn --batch-mode --no-transfer-progress \
            -f "$PROJECT_DIR/pom.xml" clean package

      - name: Verify JAR
        run: |
          JAR_FILE="$PROJECT_DIR/target/ZalReff-V2.jar"

          if [ ! -f "$JAR_FILE" ]; then
            echo "ERROR: File JAR tidak ditemukan!"
            exit 1
          fi

          jar tf "$JAR_FILE" | grep -qx 'plugin.yml'

          echo "Build berhasil!"
          ls -lh "$JAR_FILE"

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZalReff-V2-JAR
          path: ${{ env.PROJECT_DIR }}/target/ZalReff-V2.jar
          if-no-files-found: error
          retention-days: 14    
